
# Use Ctrl-h/j/k/l to navigate panes like Vim
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Enable mouse support
set -g mouse on

bind y setw synchronize-panes
# Use system clipboard with copy-mode
set-option -g set-clipboard on

# Vi-style keys in copy mode
setw -g mode-keys vi

# y to copy to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

### Minimal Modern tmux Statusline ###

# Place status at the bottom (default, but explicit)
set -g status-position bottom

# Refresh every 5 seconds
set -g status-interval 5

# Overall status bar style
set -g status-style bg=default,fg=white

# Left: session name
set -g status-left " #[bold]#S "

# Right: date + time (24h)
set -g status-right " %Y-%m-%d | %H:%M "

# Window list style
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[reverse]#I:#W#[default] "

# Inactive window style
set -g window-status-style fg=colour244   # medium grey

# Active window style (highlighted)
set -g window-status-current-style fg=white,bold

# Pane borders
set -g pane-active-border-style fg=cyan
set -g pane-border-style fg=colour241    # darker grey
